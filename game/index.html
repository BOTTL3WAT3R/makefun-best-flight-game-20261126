<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skyharbor Run: an original flight game. Fly the Kestrel K-7 mail run over the Sable Coast — thread the rings, mind the fuel, land her gently.">
<title>Skyharbor Run — a Sable Coast flight game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c141c;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    height: auto;
    aspect-ratio: 16 / 9;
    background: #7db3e0;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<noscript><p style="color:#eaf4fb;font-family:system-ui,sans-serif;text-align:center">Skyharbor Run needs JavaScript — the Kestrel is a canvas aeroplane.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
